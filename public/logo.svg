<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer subtle mandala ring -->
  <circle cx="24" cy="24" r="22" stroke="#D4A338" stroke-width="1.2" stroke-dasharray="2 3" opacity="0.8"/>
  <circle cx="24" cy="24" r="19" stroke="#C46845" stroke-width="0.8" opacity="0.4"/>
  
  <!-- Eight radial mandala accent dots -->
  <circle cx="24" cy="3" r="1.2" fill="#D4A338"/>
  <circle cx="24" cy="45" r="1.2" fill="#D4A338"/>
  <circle cx="3" cy="24" r="1.2" fill="#D4A338"/>
  <circle cx="45" cy="24" r="1.2" fill="#D4A338"/>
  <circle cx="9" cy="9" r="1" fill="#C46845"/>
  <circle cx="39" cy="9" r="1" fill="#C46845"/>
  <circle cx="9" cy="39" r="1" fill="#C46845"/>
  <circle cx="39" cy="39" r="1" fill="#C46845"/>

  <!-- Lily / Lotus Petals with Indian symmetry -->
  <g transform="translate(24, 25)">
    <!-- Central Stamen / Saffron filament -->
    <path d="M0 6 C0 0 -1.5 -8 0 -13" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
    <circle cx="0" cy="-14" r="2" fill="#F59E0B" />
    
    <!-- Central Bloom Petal -->
    <path d="M0 6 C-4 2 -6.5 -5 0 -15 C6.5 -5 4 2 0 6 Z" fill="#24140D" />
    
    <!-- Left Flanking Petal (Terracotta) -->
    <path d="M0 6 C-5.5 3.5 -12 0 -12 -7 C-12 -11 -7 -13 -4 -9 C-2 -5 -0.5 1 0 6 Z" fill="#C46845" />
    
    <!-- Right Flanking Petal (Marigold) -->
    <path d="M0 6 C5.5 3.5 12 0 12 -7 C12 -11 7 -13 4 -9 C2 -5 0.5 1 0 6 Z" fill="#F59E0B" />
    
    <!-- Outer Base Leaves (Sage/Green) -->
    <path d="M0 6 C-3 8 -9 8 -13 5 C-12 2 -8 3 -5 4 Z" fill="#708E62" />
    <path d="M0 6 C3 8 9 8 13 5 C12 2 8 3 5 4 Z" fill="#708E62" />
    
    <!-- Stem Base -->
    <path d="M0 6 C0 10 -1.5 13 -3 15" stroke="#708E62" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
