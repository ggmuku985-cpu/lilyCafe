<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="600" fill="#F5EFEB"/>
  <rect x="20" y="20" width="760" height="560" rx="16" stroke="#E3B19A" stroke-width="2" stroke-dasharray="6 6" fill="#FAF6EF"/>
  
  <!-- Subtle Jaali Background Pattern -->
  <g opacity="0.12">
    <circle cx="400" cy="300" r="160" stroke="#C46845" stroke-width="1.5"/>
    <circle cx="400" cy="300" r="120" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="4 4"/>
    <circle cx="400" cy="300" r="80" stroke="#C46845" stroke-width="1"/>
  </g>

  <!-- Cup & Steam -->
  <g transform="translate(400, 290)">
    <!-- Steam -->
    <path d="M-15 -60 C-20 -75 -10 -90 -15 -105" stroke="#D3886A" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
    <path d="M0 -65 C5 -80 -5 -95 0 -110" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    <path d="M15 -60 C10 -75 20 -90 15 -105" stroke="#D3886A" stroke-width="3" stroke-linecap="round" opacity="0.6"/>

    <!-- Cup Body -->
    <path d="M-40 -40 L40 -40 L32 30 C32 45 -32 45 -32 30 Z" fill="#24140D"/>
    <!-- Handle -->
    <path d="M36 -25 C50 -25 50 10 33 15" stroke="#24140D" stroke-width="7" stroke-linecap="round" fill="none"/>
    <!-- Saucer -->
    <ellipse cx="0" cy="46" rx="58" ry="8" fill="#C46845"/>
  </g>

  <!-- Label -->
  <text x="400" y="400" text-anchor="middle" font-family="'Playfair Display', Georgia, serif" font-size="22" fill="#24140D" font-weight="600">
    Café Lily
  </text>
  <text x="400" y="425" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="13" fill="#883D21" letter-spacing="3" text-transform="uppercase">
    Fresh Chai &amp; Kaapi
  </text>
</svg>

